name: ساخت APK اندروید

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: استخراج پروژه
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          unzip -q "$ZIP_FILE" -d extracted

      - name: پیدا کردن پروژه Android
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ساخت APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: ذخیره APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortCraft-AI-APK
          path: "extracted/**/build/outputs/apk/**/*.apk"
